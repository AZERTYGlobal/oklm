name: tests

# Lance tous les controles du depot (tools/tests/run_all.py) sur un clone propre :
# suites de tests, validateur strict sur les manifestes, parite QWERTY Global sautee
# (les sources du site ne sont pas dans le depot).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 = version minimale verifiee : sous 3.9/3.10 (Unicode 13) les goldens .ldml divergent,
        # U+20C0 y est inassigne et l'exporteur l'echappe differemment.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Lancer tous les controles
        run: python -B tools/tests/run_all.py -v
